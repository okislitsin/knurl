[package]
name = "knurl-sim"
version = "0.1.0"
edition = "2024"
description = "Desktop (and future web) simulator for the knurl embedded TUI library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/okislitsin/knurl"
keywords = ["embedded", "tui", "simulator", "oled", "embedded-graphics"]
categories = ["embedded", "development-tools", "simulation"]
# Dev/demo crate with a system dependency (SDL2) - not published to crates.io.
# Get it from the git repository instead.
publish = false

[dependencies]
# The facade, exactly as a device project depends on it - so a demo's screen
# code and a firmware's screen code are written against the same paths.
knurl = { path = "../knurl", version = "0.2.3", features = ["graphics"] }
embedded-graphics = "0.8"
# Pinned to the release that targets embedded-graphics 0.8 - the `DrawTarget`
# types must unify with knurl-graphics, or `GraphicsTarget` won't accept the
# `SimulatorDisplay`. Optional so the `web` feature (and `cargo test`) need not
# pull in SDL2.
embedded-graphics-simulator = { version = "0.8.0", optional = true }

[dev-dependencies]
# The demo application itself: no_std screens, shared by both demos and built
# for thumbv6m in CI.
knurl-screens = { path = "../knurl-screens" }
# Test-only: the screenshot matrix compares decoded pixels against its golden
# images, never PNG bytes - an encoder that changes its output between versions
# would otherwise make the matrix lie. Already in the tree via
# embedded-graphics-simulator; only the PNG codec is needed.
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = ["desktop"]
# Desktop backend: SDL2 window via embedded-graphics-simulator (system dep).
desktop = ["dep:embedded-graphics-simulator"]
# Placeholder for a future WASM/web backend - builds without SDL2.
web = []
